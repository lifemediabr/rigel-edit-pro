<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D0F1A">
<link rel="icon" href="/static/orion-fav-32.png">
<title>{% block titulo %}Rigel Edit Pro{% endblock %}</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(/static/fontes/bricolage-grotesque-latin-700-normal.woff) format("woff");font-weight:700}
@font-face{font-family:"IBM Plex Sans";src:url(/static/fontes/ibm-plex-sans-latin-400-normal.woff) format("woff");font-weight:400}
@font-face{font-family:"IBM Plex Sans";src:url(/static/fontes/ibm-plex-sans-latin-700-normal.woff) format("woff");font-weight:700}
@font-face{font-family:"IBM Plex Mono";src:url(/static/fontes/ibm-plex-mono-latin-400-normal.woff) format("woff");font-weight:400}
:root{--bg:#0D0F1A;--fundo2:#0A0C15;--c1:#181B29;--c2:#1F2334;--c3:#272C40;--claro:#F6F3EC;--lima:#B8E536;--rosa:#FF4FA3;
--azul:#2F8CFF;--amar:#FFC83D;--verm:#D62828;--mu:#9A9FB5;--ln:#2A2E42;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--claro);font:15px/1.45 var(--body)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.topo{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--fundo2);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:10px;flex:none}
.marca img{height:22px}
.marca b{font:700 19px var(--display);letter-spacing:-.02em;white-space:nowrap}
.marca b span{color:var(--lima)}
.topo nav{display:flex;gap:4px;margin-left:8px;overflow-x:auto}
.topo nav a{padding:8px 14px;border-radius:999px;color:var(--mu);font-weight:700;font-size:14px;white-space:nowrap}
.topo nav a.on,.topo nav a:hover{background:var(--c2);color:var(--claro)}
.esp{flex:1}
.pilula{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--c2);color:var(--mu);white-space:nowrap}
.pilula.lima{background:var(--lima);color:#141a05}.pilula.rosa{background:var(--rosa);color:#fff}.pilula.azul{background:var(--azul);color:#fff}
.pilula.amar{background:var(--amar);color:#2a1d00}.pilula.verm{background:var(--verm);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;min-height:40px;font-weight:700;cursor:pointer;background:var(--lima);color:#141a05;white-space:nowrap}
.btn.sec{background:var(--c2);color:var(--claro);border:1px solid var(--ln)}
.btn.fant{background:transparent;color:var(--mu)}
.btn.perigo{background:transparent;color:#ff8080;border:1px solid #4a2630}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;font-size:16px}
label.rot{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px;font-weight:700}
.mono{font-family:var(--mono)}.mu{color:var(--mu)}
.cartao{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:18px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
.aviso{background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.35);color:var(--amar);padding:10px 14px;border-radius:14px;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:10px}
.check input{width:20px;height:20px;accent-color:var(--lima);flex:none;margin-top:1px}
.modal{position:fixed;inset:0;background:rgba(5,6,12,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .cartao{max-width:440px;width:100%}
@media(max-width:600px){.topo{gap:8px;padding:10px 12px}.topo .usr{display:none}.marca b{font-size:16px}.marca img{height:18px}.topo{flex-wrap:wrap}.topo nav{margin-left:0;order:3;width:100%}.topo nav a{padding:7px 12px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block corpo %}{% endblock %}
</body>
</html>
